x-airflow-common: &airflow-common
  build:
    context: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    KAGGLE_USERNAME: ${KAGGLE_USERNAME}
    KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}
    POSTGRES_PORT: ${POSTGRES_PORT}
  volumes:
    - ./dbt:/usr/app/dbt
    - ./dags:/opt/airflow/dags
    - ./datasets:/opt/airflow/datasets
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db init && airflow users create
        --username admin
        --password admin123
        --firstname admin
        --lastname admin
        --role Admin
        --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dbt:
    image: olist-dbt:1.0
    ports:
      - "8085:8080"
    build:
      context: ./dbt
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: []
    command: tail -f /dev/null # supaya container idle, dijalankan via 'docker compose exec dbt ...'

  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: olist_net

volumes:
  postgres_data:
  metabase_data:
  airflow_logs: